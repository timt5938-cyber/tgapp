[project]
name = "tgapp"
version = "1.0.0"
description = "Telegram Handwritten Conspectus Studio & Bot"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "aiogram>=3.4.0",
    "opencv-python-headless>=4.9.0",
    "pillow>=10.2.0",
    "reportlab>=4.1.0",
    "google-genai>=0.1.0",
    "supabase>=2.3.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.9",
    "requests>=2.31.0",
    "aiofiles>=23.2.1",
    "numpy>=1.26.0",
]

[tool.vercel]
entrypoint = "api.backend.app.main:app"
